<!DOCTYPE html>
<html lang="ru">

<style>
:root{--bg:#f5f5f3;--card:#fff;--ink:#141414;--mute:#6e6e6a;--line:#e5e5e0;--acc:#1f5eff;--accs:#eaf0ff;--ok:#167a46;--oks:#e6f4ec;--warn:#9a5b00;--warns:#fdf1dc;--bad:#b9312a;--bads:#fbe9e7}

body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff}
.top .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.2px}
.logo span{opacity:.55;font-weight:500}
.seg{display:flex;background:#2a2a2a;border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;color:#cfcfcf;padding:6px 12px;border-radius:8px;cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button.on{background:#fff;color:var(--ink);font-weight:600}
.seg .n{background:var(--acc);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:600}
.reset{border:0;background:none;color:#9a9a9a;cursor:pointer;font-size:12px}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 80px}
.wrap.wide{max-width:1080px}
h1{font-size:22px;margin:4px 0 16px;letter-spacing:-.2px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:22px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.list .card{margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.list .card:hover{border-color:#bdbdb6}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1;min-width:0}
.s{color:var(--mute);font-size:13px}
.xs{color:var(--mute);font-size:12px}
.b{font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.p-new{background:var(--accs);color:var(--acc)}
.p-work{background:#efefec;color:#444}
.p-confirm{background:var(--warns);color:var(--warn)}
.p-assembly,.p-partial{background:#f0eafe;color:#5b34c7}
.p-shipped{background:var(--oks);color:var(--ok)}
.p-cancelled{background:#efefec;color:#8a8a85;text-decoration:line-through}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#bdbdb6}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#333}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.full{width:100%}
.f{margin-bottom:10px}
.f label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:500}
.f label i{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink)}
.f.err input,.f.err select{border-color:var(--bad);background:var(--bads)}
.card.errc{border-color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.span2{grid-column:span 2}
.tog{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.tog button{flex:1;border:0;background:none;padding:8px;cursor:pointer;color:var(--mute)}
.tog button.on{background:var(--ink);color:#fff}
.pos{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}
.pos.err{border-color:var(--bad)}
.det{font-size:12px;margin:-4px 0 8px;min-height:18px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:#efefec;color:#444;margin-right:4px}
.tag.ok{background:var(--oks);color:var(--ok)}
.tag.warn{background:var(--warns);color:var(--warn)}
.tag.acc{background:var(--accs);color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.steps{display:flex;gap:4px;margin:6px 0 16px}
.steps div{flex:1}
.steps .bar{height:4px;border-radius:2px;background:var(--line)}
.steps .on .bar{background:var(--ink)}
.steps .cur .bar{background:var(--acc)}
.steps .t{font-size:11px;color:var(--mute);margin-top:5px}
.steps .cur .t{color:var(--ink);font-weight:600}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:500}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}

.mgr{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:500}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs .c{font-size:12px;margin-left:3px;color:var(--mute)}
.list .card.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

.ms{background:#f7f7f5;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.hist{margin-top:14px}
.hist div{font-size:12px;color:var(--mute);padding:3px 0;display:flex;gap:10px}
.hist b{color:var(--ink);font-weight:500;min-width:40px}
.pick{position:relative}
.dd{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);max-height:220px;overflow:auto;margin-top:4px}
.dd div{padding:8px 10px;cursor:pointer;font-size:13px}
.dd div:hover{background:#f3f3f1}
.chk{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer;user-select:none}

.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk.done{opacity:.5;cursor:default}
.sticky{position:sticky;bottom:12px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.2);z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.note{background:var(--accs);color:#1d3f9e;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.call{font-size:22px;font-weight:700;letter-spacing:1px;margin:6px 0}
.call u{text-decoration:none;background:var(--warns);padding:0 4px;border-radius:4px}
a{color:var(--acc)}
.bw{position:relative}
.bell{display:flex;align-items:center;gap:6px}
.n2{background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:600}
.notes{position:absolute;right:0;top:40px;width:330px;max-width:86vw;z-index:20;padding:6px;max-height:420px;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.12)}
.nt{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;gap:8px}
.nt:hover{background:#f3f3f1}
.nt .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);margin-top:6px;flex:none}
.nt.rd .dot{background:transparent}
.nt.rd{color:var(--mute)}
.chat{display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;background:#f1f1ee;border-radius:14px;padding:8px 11px;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff}
.msg .who{font-size:11px;opacity:.6;margin-bottom:2px}
.msg img{max-width:220px;width:100%;border-radius:8px;display:block;margin:2px 0 4px}
.inp{border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;background:#fff;min-width:0}
.inp:focus{border-color:var(--ink)}
.push{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px}
@media(max-width:820px){.mgr{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>

function it(store,url,code,name,qty,unit){return {store:store,url:url,code:code,name:name,qty:qty,unit:unit,note:'',match:'none',sku:null,price:0,picked:false,shipped:false};}
function t(minAgo){var d=new Date(Date.now()+(minAgo||0)*60000);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}

var S;
function load(){ try{var x=localStorage.getItem('sk-zayavki-demo-v5'); if(x){S=JSON.parse(x);return;}}catch(e){} S=seed(); prepSeed(); }
function save(){ try{localStorage.setItem('sk-zayavki-demo-v5',JSON.stringify(S));}catch(e){} }
function prepSeed(){ S.requests.forEach(function(r){ r.items.forEach(function(i){ autoMatch(i); if(r.status!=='new'&&r.status!=='work'&&i.match==='none'){var c=S.catalog.filter(function(x){return x.name.toLowerCase().indexOf(i.name.split(' ')[0].toLowerCase())>=0;})[0]; if(c){i.match='found';i.sku=c.id;i.price=c.price;}} if(r.status==='shipped')i.shipped=true; if(r.status==='assembly')i.picked=true; }); }); }
function resetAll(){ try{localStorage.removeItem('sk-zayavki-demo-v5');}catch(e){} S=seed(); prepSeed(); render(); toast('Демо сброшено'); }

function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function byId(id){return S.requests.filter(function(r){return r.id===id;})[0];}
function sku(id){return S.catalog.filter(function(c){return c.id===id;})[0];}
function rub(n){return Math.round(n).toLocaleString('ru-RU')+' ₽';}
var tt; function toast(m){var el=$('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){el.classList.remove('on');},3400);}
function pill(s){return '<span class="pill p-'+s+'">'+ST[s]+'</span>';}
function addr(o){return [o.jk, o.street&&(o.street+', '+o.house), o.apt&&('кв. '+o.apt)].filter(Boolean).join(' · ');}

function log(r,txt){r.history.push([t(),txt]);}

/* ---------- ссылка → магазин и код ---------- */
function parseLink(u){
  u=(u||'').trim(); if(!u) return {store:'',code:''};
  var m;
  if(/petrovich\.ru/i.test(u)){ m=u.match(/\/product\/(\d+)/); return {store:'Петрович', code:m?m[1]:''}; }
  if(/leroymerlin\.ru/i.test(u)){ m=u.match(/-(\d{6,})\/?(?:[?#].*)?$/)||u.match(/\/(\d{6,})\/?(?:[?#].*)?$/); return {store:'Леруа Мерлен', code:m?m[1]:''}; }
  if(/vseinstrumenti\.ru/i.test(u)){ m=u.match(/-(\d{5,})\/?(?:[?#].*)?$/)||u.match(/\/(\d{5,})\/?(?:[?#].*)?$/); return {store:'ВсеИнструменты', code:m?m[1]:''}; }
  return {store:'Другой', code:''};
}
function findSku(store,code){ if(!code) return null; return S.catalog.filter(function(c){return c.store===store&&c.code===code;})[0]||null; }
function autoMatch(i){ if(i.match!=='none') return; var c=findSku(i.store,i.code); if(c){i.match='found';i.sku=c.id;i.price=c.price;} }

function render(){
  var nNew=unread('mgr');
  var nAsm=S.requests.filter(function(r){return r.status==='assembly'||r.status==='partial';}).length;
  var nCust=S.cust.logged?unread('cust:'+S.cust.company):0;
  $('seg').innerHTML=[['cust','Заказчик',nCust],['mgr','Менеджер',nNew]].map(function(x){
    return '<button class="'+(S.role===x[0]?'on':'')+'" onclick="setRole(\''+x[0]+'\')">'+x[1]+(x[2]?'<span class="n">'+x[2]+'</span>':'')+'</button>';}).join('');
  var h = S.role==='mgr'?renderMgr():renderCust();
  $('app').innerHTML=h; save();
}

function detHtml(i){
  if(!i.url) return '<span class="xs">Есть ссылка — вставьте, магазин и код определятся сами. Нет — просто напишите название</span>';

  var c=findSku(i.store,i.code);
  return '<span class="tag acc">'+e(i.store)+'</span><span class="tag">код '+e(i.code)+'</span>'+(c?'<span class="tag ok">есть в МоёмСкладе</span>':'<span class="tag warn">новый товар</span>');
}
function setUrl(n,v){var i=S.draft.items[n]; i.url=v; var p=parseLink(v); i.store=p.store; i.code=p.code; $('det-'+n).innerHTML=detHtml(i); save();}
function addPos(){S.draft.items.push(it('','','','','','шт')); S.draft.market.push(false); render();}
function delPos(n){S.draft.items.splice(n,1); S.draft.market.splice(n,1); render();}
function submitForm(){
  var d=S.draft, o=d.object; errs={};
  OBJ_F.forEach(function(f){ if(f[2]&&!String(o[f[0]]).trim()) errs['o.'+f[0]]=1; });
  if(!d.parsed.length) errs.items=1;
  d.parsed.forEach(function(i){ if(!(i.qty>0)) errs.items=1; });
  if(!d.date) errs.date=1;
  if(Object.keys(errs).length){ render(); toast('Не всё заполнено — поля отмечены красным'); return; }
  var id='З-'+(S.reqSeq++);
  var items=d.parsed.map(function(i){var x=JSON.parse(JSON.stringify(i)); x.match='none'; x.sku=null; x.price=0; autoMatch(x); return x;});
  var r={id:id, company:S.cust.company, author:S.cust.name, phone:S.cust.phone, status:'new', date:d.date, window:d.window, urgent:d.urgent, comment:d.comment, object:JSON.parse(JSON.stringify(o)), items:items, source:{cart:d.cartUrl.trim(), list:d.list.trim()}, history:[[t(),'Заявка создана заказчиком']]};
  S.requests.push(r); S.draft=null; S.cust.screen='detail'; S.cust.openId=id; S.mgr.tab='new'; S.mgr.openId=id;
  render(); window.scrollTo(0,0); notify('mgr','Новая заявка '+id+' от '+r.company,id); render(); toast('Заявка '+id+' отправлена. Менеджеры получили уведомление');
}

/* ---------- корзина и список ---------- */
function cartSection(){
  var d=S.draft;
  var h='<h2>Товары</h2><div class="card'+(errs.items?' errc':'')+'">'+
    '<div class="f"><label>Ссылка на корзину Петровича</label><input value="'+e(d.cartUrl)+'" oninput="S.draft.cartUrl=this.value;reparse();" placeholder="Петрович → Корзина → Поделиться → вставьте ссылку"></div>'+
    '<div class="xs" style="text-align:center;margin:2px 0 8px">или, если корзину не собирали</div>'+
    '<div class="f" style="margin-bottom:0"><label>Список товаров</label><textarea rows="5" oninput="S.draft.list=this.value;reparse();" placeholder="Каждый товар с новой строки, например:\nГКЛ влагостойкий 12,5 — 40 шт\nРотбанд 30 кг 20 мешков\nhttps://petrovich.ru/product/163222/ 5 шт">'+e(d.list)+'</textarea></div>'+
    '<div id="prev">'+prevHtml()+'</div></div>';
  return h;
}
var DEMO_CART=[['Петрович','100101','Штукатурка гипсовая Ротбанд 30 кг',20,'меш'],['Петрович','100387','Профиль ПП 60×27, 3 м',60,'шт'],['Петрович','100412','Грунтовка глубокого проникновения 10 л',3,'шт'],['Петрович','163222','Товар из корзины, код 163222',5,'шт']];
function isCart(u){ u=(u||'').trim(); return /petrovich\.ru/i.test(u) && !/\/product\//i.test(u); }
var UNIT_RX=/^(шт|штук[аи]?|м2|м²|кв\.?\s?м|п\.?\s?м|м|уп|упак[а-яё]*|меш[а-яё]*|кг|л|литр[а-яё]*|рул[а-яё]*|лист[а-яё]*)\.?$/i;
function normUnit(u){
  u=(u||'').toLowerCase().replace(/\s/g,'');
  if(!u||/^шт/.test(u)) return 'шт';
  if(/^(м2|м²|кв\.?м)$/.test(u)) return 'м²';
  if(/^(п\.?м|м)$/.test(u)) return 'м';
  if(/^уп/.test(u)) return 'уп';
  if(/^меш/.test(u)) return 'меш';
  if(/^кг/.test(u)) return 'кг';
  if(/^(л|литр)/.test(u)) return 'л';
  if(/^рул/.test(u)) return 'рул';
  if(/^лист/.test(u)) return 'лист';
  return 'шт';
}
function parseLine(l){
  l=l.trim().replace(/^\d+[.)]\s+/,'').replace(/^[-•*–]\s*/,'');
  if(!l) return null;
  var url=(l.match(/https?:\/\/\S+/)||[])[0], p=url?parseLink(url):{store:'',code:''}, rest=url?l.replace(url,'').trim():l;
  var m=rest.match(/^(.*?)[\s,;:—–\-x×*]*(\d+(?:[.,]\d+)?)\s*([а-яё²2.\s]{0,10})$/i), name=rest, qty=0, unit='шт';
  if(m && (m[3].trim()==='' || UNIT_RX.test(m[3].trim()))){ name=m[1].replace(/[\s,;:—–\-]+$/,'').trim(); qty=parseFloat(m[2].replace(',','.')); unit=normUnit(m[3]); }
  if(!name && p.code){ var c=findSku(p.store,p.code); name=c?c.name:'Товар '+p.store+', код '+p.code; }
  if(!name) return null;
  var x=it(p.store,url||'',p.code,name,qty,unit); return x;
}
function reparse(){
  var d=S.draft, out=[];
  if(isCart(d.cartUrl)) DEMO_CART.forEach(function(c){ out.push(it(c[0],'',c[1],c[2],c[3],c[4])); });
  (d.list||'').split(/\n+/).forEach(function(l){ var x=parseLine(l); if(x) out.push(x); });
  out.forEach(function(x){ x.match='none'; autoMatch(x); });
  d.parsed=out; save();
  var el=$('prev'); if(el) el.innerHTML=prevHtml();
}
function prevHtml(){
  var d=S.draft, ps=d.parsed||[];
  if(!ps.length) return (d.cartUrl&&!isCart(d.cartUrl))?'<div class="note" style="margin:10px 0 0;background:var(--warns);color:var(--warn)">Это не похоже на ссылку на корзину Петровича</div>':'';
  var h='<div class="row" style="margin:14px 0 6px"><div class="sp b">Распознано: '+ps.length+' поз.</div>'+(isCart(d.cartUrl)?'<span class="xs">в демо корзина — тестовая</span>':'')+'</div><table>';
  ps.forEach(function(i,n){
    var st=i.match==='found'?'<span class="tag ok">есть в МоёмСкладе</span>':i.code?'<span class="tag warn">новый товар</span>':'<span class="tag">уточнит менеджер</span>';
    h+='<tr><td>'+e(i.name)+'<div class="xs">'+(i.store?e(i.store)+(i.code?' · '+e(i.code):'')+' · ':'')+st+'</div></td>'+
      '<td class="num" style="width:120px"><input class="inp" style="width:62px;text-align:right;padding:5px 6px'+(i.qty>0?'':';border-color:var(--bad);background:var(--bads)')+'" value="'+(i.qty||'')+'" placeholder="?" oninput="S.draft.parsed['+n+'].qty=parseFloat(this.value.replace(\',\',\'.\'))||0;save();"> '+e(i.unit)+'</td>'+
      '<td class="num" style="width:30px"><a href="#" onclick="S.draft.parsed.splice('+n+',1);$(\'prev\').innerHTML=prevHtml();save();return false;" title="Убрать">✕</a></td></tr>';
  });
  h+='</table>';
  if(ps.some(function(i){return !(i.qty>0);})) h+='<div class="xs" style="color:var(--bad);margin-top:6px">У некоторых позиций не нашлось количество — впишите его</div>';
  return h;
}
function repeatReq(id){
  var r=byId(id); newForm();
  S.draft.object=JSON.parse(JSON.stringify(r.object));
  S.draft.list=r.items.map(function(i){ return (i.sku?sku(i.sku).name:i.name)+(i.url?' '+i.url:'')+' — '+i.qty+' '+i.unit; }).join('\n');
  reparse(); render(); window.scrollTo(0,0); toast('Объект и товары скопированы из '+id+'. Поправьте и отправьте');
}

/* ---------- компании и история заказов ---------- */
function reqSum(r){ return r.items.reduce(function(a,i){return a+(i.price||0)*i.qty;},0); }
function companies(){
  var m={};
  S.requests.forEach(function(r){
    var c=m[r.company]||(m[r.company]={name:r.company, reqs:[], people:{}, objs:{}});
    c.reqs.push(r); c.people[r.author+' · '+r.phone]=1; c.objs[addr(r.object)]=1;
  });
  return Object.keys(m).map(function(k){return m[k];});
}
function openCompany(name){ S.mgr.view='company'; S.mgr.company=name; render(); window.scrollTo(0,0); }
function mgrHead(title,back){
  return '<div class="wrap wide"><div class="row">'+(back?'<button class="btn sm" onclick="'+back+'">←</button>':'')+'<h1 class="sp" style="margin:0">'+title+'</h1>'+bellBox()+'</div><div style="height:16px"></div>';
}
function renderCompanies(){
  var cs=companies();
  var h=mgrHead('Компании','S.mgr.view=\'reqs\';render();')+'<div class="card"><table><tr><th>Компания</th><th class="num">Заявок</th><th class="num">Объектов</th><th class="num">Сумма заказов</th><th>Последняя</th></tr>';
  cs.forEach(function(c){
    var done=c.reqs.filter(function(r){return r.status==='assembly';}), last=c.reqs.slice().sort(function(a,b){return a.id<b.id?1:-1;})[0];

function take(id){var r=byId(id); r.status='work'; r.changed=null; log(r,'Менеджер Стас взял в работу'); S.mgr.tab='work'; render();}

  var i=byId(id).items[n], c={id:'n'+Date.now(), store:i.store==='Рынок'?'':i.store, code:i.code, name:i.name, price:0, unit:i.unit, url:i.url};

function sendConfirm(id){var r=byId(id); r.status='confirm'; log(r,'Отправлена заказчику на подтверждение'); notify('cust:'+r.company,'Заявка '+id+' ждёт вашего подтверждения',id); S.mgr.tab='confirm'; render(); toast('Заказчику пришло уведомление: заявка ждёт подтверждения');}

/* ================= УВЕДОМЛЕНИЯ И ЧАТ ================= */

  /* SMS заказчику: на все события, кроме переписки в чате (как на сервере) */

function myKey(){ return S.role==='mgr'?'mgr':'cust:'+S.cust.company; }

function openNote(i){
  var n=S.notes[i], r=byId(n.id); S.bellOpen=false;
  if(S.role==='mgr'){ S.mgr.tab=r.status==='assembly'||r.status==='partial'?'asm':r.status; mgrOpen(n.id); }
  else openCust(n.id);
}
function mgrOpen(id){ markRead('mgr',id); S.mgr.openId=id; S.bellOpen=false; render(); }
function pushBanner(){
  var k=S.role==='mgr'?'mgr':'cust'; if(S.push[k]) return '';
  return '<div class="push"><div class="sp">'+(k==='mgr'?'Включите уведомления — новые заявки и сообщения придут, даже когда сайт закрыт.':'Включите уведомления, чтобы не пропустить подтверждение и сообщения менеджера.')+'</div><button class="btn sm pri" onclick="S.push.'+k+'=true;render();toast(\'Уведомления включены. В демо они показываются внизу экрана\');">Включить</button></div>';
}
function chatHtml(r){
  var me=S.role==='mgr'?'mgr':'cust', ch=r.chat||[];
  var h='<h2>Переписка</h2><div class="chat">'+(ch.length?ch.map(function(m){return '<div class="msg'+(m.from===me?' me':'')+'"><div class="who">'+e(m.name)+' · '+m.t+'</div>'+(m.img?'<img src="'+m.img+'" alt="">':'')+(m.text?'<div>'+e(m.text)+'</div>':'')+'</div>';}).join(''):'<div class="xs">Сообщений пока нет. Вопрос по заявке — пишите здесь.</div>')+'</div>';
  h+='<div class="row" style="margin-top:10px"><label class="btn sm" title="Прикрепить фото" style="cursor:pointer">📎<input type="file" accept="image/*" hidden onchange="sendPhoto(\''+r.id+'\',this)"></label><input id="msg" class="inp sp" placeholder="Сообщение…" onkeydown="if(event.key===\'Enter\')sendMsg(\''+r.id+'\')"><button class="btn sm pri" onclick="sendMsg(\''+r.id+'\')">Отправить</button></div>';
  return h;
}
function pushMsg(id,m,preview){
  var r=byId(id); r.chat=r.chat||[]; r.chat.push(m);
  if(m.from==='mgr') notify('cust:'+r.company,'Менеджер по '+id+': '+preview,id); else notify('mgr','Сообщение по '+id+': '+preview,id);
  render(); toast(m.from==='mgr'?'Заказчик получил уведомление':'Менеджер получил уведомление');
}
function who(){ return S.role==='mgr'?{from:'mgr',name:'Стас'}:{from:'cust',name:S.cust.name||'Заказчик'}; }
function sendMsg(id){ var v=$('msg').value.trim(); if(!v) return; var w=who(); pushMsg(id,{from:w.from,name:w.name,t:t(),text:v},v); }
function sendPhoto(id,inp){
  var f=inp.files&&inp.files[0]; if(!f) return; var rd=new FileReader();
  rd.onload=function(){ var im=new Image(); im.onload=function(){ var k=Math.min(1,600/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=im.width*k; c.height=im.height*k; c.getContext('2d').drawImage(im,0,0,c.width,c.height); var w=who(); pushMsg(id,{from:w.from,name:w.name,t:t(),img:c.toDataURL('image/jpeg',.7),text:''},'фото'); }; im.src=rd.result; };
  rd.readAsDataURL(f);
}

/* ================= ВОЛОДЯ ================= */
function renderVova(){
  var v=S.vova, list=S.requests.filter(function(r){return r.status==='assembly'||r.status==='partial';});
  if(v.openId){ var r=byId(v.openId); if(r&&(r.status==='assembly'||r.status==='partial')) return '<div class="wrap">'+vovaDetail(r)+'</div>'; v.openId=null; }
  var done=S.requests.filter(function(r){return r.status==='shipped';});
  return '<div class="wrap"><h1>Сборка</h1><div class="list">'+(list.length?list.map(function(r){
    var left=r.items.filter(function(i){return !i.shipped;}).length;
    return '<div class="card" onclick="S.vova.openId=\''+r.id+'\';render();"><div class="row"><div class="sp"><div class="b">'+r.id+' · заказ №'+r.ms.order+'</div><div class="s">'+e(addr(r.object))+'</div><div class="xs">к '+dateRu(r.date)+(r.window?', '+e(r.window):'')+' · отгрузить '+left+' поз.</div></div>'+pill(r.status)+'</div></div>';
  }).join(''):'<div class="empty">Нечего отгружать</div>')+'</div>'+
  (done.length?'<h2>Отгружены на сборку</h2><div class="list">'+done.slice().reverse().map(function(r){return '<div class="card" style="cursor:default"><div class="row"><div class="sp"><div class="b">'+r.id+' · заказ №'+r.ms.order+'</div><div class="s">'+e(addr(r.object))+'</div></div>'+pill(r.status)+'</div></div>';}).join('')+'</div>':'')+'</div>';
}
function vovaDetail(r){
  var left=r.items.filter(function(i){return !i.shipped;}), picked=left.filter(function(i){return i.picked;}).length;
  var h='<div class="row"><button class="btn sm" onclick="S.vova.openId=null;render();">← Отгрузка</button></div>'+
    '<h1 style="margin:14px 0 2px">'+r.id+'</h1><div class="s" style="margin-bottom:14px">Заказ №'+r.ms.order+' · '+e(addr(r.object))+'</div><div class="xs" style="margin:-6px 0 12px">Снимите галочку с того, чего нет в наличии</div>';
  r.items.forEach(function(i,n){
    var nm=i.sku?sku(i.sku).name:i.name;
    h+='<div class="chk '+(i.shipped?'done on':i.picked?'on':'')+'" '+(i.shipped?'':'onclick="pick(\''+r.id+'\','+n+')"')+'><div class="box">'+(i.picked||i.shipped?'✓':'')+'</div><div class="sp"><div class="b">'+e(nm)+'</div><div class="xs">'+(i.shipped?'уже отгружено':i.store?e(i.store):'')+'</div></div><div class="b" style="white-space:nowrap">'+i.qty+' '+e(i.unit)+'</div></div>';
  });
  var all=picked===left.length;
  h+='<div class="sticky">'+(picked?'<button class="btn '+(all?'pri':'acc')+' full" onclick="ship(\''+r.id+'\')">'+(all?'Отгрузить на сборку':'Отгрузить на сборку '+picked+' из '+left.length)+'</button>'+(all?'':'<div class="xs" style="text-align:center;margin-top:6px">Остальное останется в заявке и уйдёт следующей отгрузкой</div>'):'<button class="btn full" disabled>Отметьте, что отгружаем</button>')+'</div>';
  return h;
}
function pick(id,n){var i=byId(id).items[n]; i.picked=!i.picked; render();}
function ship(id){
  var r=byId(id), batch=r.items.filter(function(i){return !i.shipped&&i.picked;});
  batch.forEach(function(i){i.shipped=true;});
  var no='ОТ-0'+(S.shipSeq++); r.shipments=r.shipments||[]; r.shipments.push({no:no,n:batch.length});
  var rest=r.items.filter(function(i){return !i.shipped;}).length;
  r.status=rest?'partial':'shipped';
  log(r,'Максим отгрузил на сборку. В МоёмСкладе отгрузка №'+no+' ('+batch.length+' поз.)'+(rest?', ждут ещё '+rest:''));
  if(!rest) S.vova.openId=null;
  render(); toast('В МоёмСкладе создана отгрузка №'+no+' на основании заказа №'+r.ms.order);
}

load(); render();
</script>
</body>
</html>
