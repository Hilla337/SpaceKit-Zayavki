# Стенд в Яндекс Облаке: одна ВМ на Container Optimized Image запускает этот файл (метаданные docker-compose).
# Значения в двойных подчёркиваниях подставляет сценарий .github/workflows/stand.yml (render.py), секреты — из GitHub Secrets.
version: '3.7'
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: zayavki
      POSTGRES_USER: zayavki
      POSTGRES_PASSWORD: __DB_PASSWORD__
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: __IMAGE__
    restart: always
    depends_on:
      - db
    environment:
      NODE_ENV: production
      APP_VERSION: __IMAGE__
      PORT: '8080'
      DATABASE_URL: __DATABASE_URL__
      AUTH_PEPPER: __AUTH_PEPPER__
      TRUST_PROXY_HOPS: '1'
      APP_URL: __APP_URL__
      SMS_PROVIDER: none
      BOOTSTRAP_ADMIN_PHONE: __ADMIN_PHONE__
      BOOTSTRAP_ADMIN_PASSWORD: __ADMIN_PASSWORD__
      BOOTSTRAP_ADMIN_NAME: __ADMIN_NAME__
      # МойСклад на стенде: каталог и остатки читаются; заказы создаются в статусе «Тест :3», чтобы их было
      # легко отличить и удалить; отгрузки в МойСклад из стенда не создаются (не списываем настоящие остатки);
      # отгрузки и статусы заказов из МойСклад возвращаются в приложение через вебхуки.
      MS_TOKEN: __MS_TOKEN__
      MS_SYNC_HOURS: __MS_SYNC_HOURS__
      MS_STOCK_MINUTES: '15'
      MS_WRITE: __MS_WRITE__
      MS_ORDER_STATE: 'Тест :3'
      MS_DEMANDS: '0'
      MS_WEBHOOKS: __MS_WRITE__
      MS_ORGANIZATION_ID: '6b6f7a0f-77aa-11f0-0a80-1726002d9376'
      MS_STORE_ID: '6b7181fb-77aa-11f0-0a80-1726002d9379'

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    # Сертификат HTTPS выпускается сам (Let's Encrypt) на адрес вида 1-2-3-4.sslip.io.
    command: caddy reverse-proxy --from __DOMAIN__ --to app:8080
    volumes:
      - caddy_data:/data

volumes:
  pgdata: {}
  caddy_data: {}
